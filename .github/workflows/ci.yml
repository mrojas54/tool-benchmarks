# Continuous integration — the tech-debt gate.
#
# Runs the quality gate documented in README.md and AGENTS.md — ruff,
# complexity regression, mypy --strict, pytest — on every pull request and on
# pushes to main, so new lint / complexity / type / test debt can't land
# unnoticed. This is the enforcement half of the tech-debt routine; the
# periodic *assessment* is a separate local tool (see
# docs/superpowers/specs/2026-07-15-tech-debt-cicd-routine-design.md).
#
# Two jobs: `gate` runs the full quality gate on the default install (13
# packages, no optional extras), and `tracing` re-runs the test suite with the
# optional `tracing` extra installed so the lmnr-guarded tests actually execute
# somewhere. Keeping them separate preserves the default install's small
# supply-chain surface while closing the coverage hole it creates.
#
# Security note: the event-derived complexity base is a Git SHA placed in an
# environment variable and quoted by the static run command; event text is not
# interpolated into shell source.
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: python (ruff + complexity + mypy --strict + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen asserts uv.lock is in sync with pyproject.toml (fails CI if a
      # dependency change forgot to re-lock), so the environment is reproducible
      # from the committed lock. --python 3.13 matches requires-python >=3.13;
      # uv provisions the interpreter if the runner lacks it. The dev dependency
      # group (ruff, mypy, pytest) installs by default under uv sync.
      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Cyclomatic complexity regressions
        env:
          COMPLEXITY_BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          uv run python -m toolbench.complexity_gate
          --base "$COMPLEXITY_BASE_SHA"

      - name: Type-check (mypy --strict)
        run: uv run mypy --strict src/toolbench tests

      - name: Tests (pytest)
        run: uv run pytest -q

  tracing:
    name: python (pytest with the optional tracing extra)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # No fetch-depth: 0 here — unlike `gate`, this job runs no Git-base
      # comparison, so the default shallow checkout is enough.
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `gate` deliberately does not install the `tracing` extra: the package
      # keeps zero required runtime dependencies and the default CI install is
      # 13 packages, which is worth protecting. The cost is that every test
      # guarded on `lmnr` being importable silently skips there — including
      # tests/test_observability.py::test_real_sdk_export_is_sanitized, the only
      # test exercising the real Laminar SDK's export sanitization rather than a
      # fake. This job is the one lane where the opt-in is actually taken.
      - name: Install dependencies (with tracing extra)
        run: uv sync --frozen --python 3.13 --extra tracing

      # Fail loudly if the extra stops resolving. Without this, a rename or a
      # lock change would quietly turn this job back into a green run of exactly
      # the skips it exists to prevent.
      - name: Assert the tracing SDK is importable
        run: >-
          uv run python -c "import importlib.util;
          assert importlib.util.find_spec('lmnr'),
          'tracing extra did not install lmnr'"

      - name: Tests (pytest, tracing extra installed)
        run: uv run pytest -q
