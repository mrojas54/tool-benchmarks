[project]
name = "toolbench"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
toolbench = "toolbench.cli:main"

[project.optional-dependencies]
tracing = [
    "lmnr>=0.7.56",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

# The rule set is pinned EXPLICITLY rather than inherited from Ruff's defaults,
# because "the default rule set" is not a fixed thing to depend on. Ruff 0.16
# expanded its defaults from these four families to 413 rules (adding S, BLE, B,
# SIM, UP, I, PL, RUF, FURB, ISC, ...), and on this tree that turned a clean
# `ruff check .` into 122 findings across a routine `uv lock --upgrade` -- 49 of
# them inside `tools/`, the vendored probe corpus, whose files are benchmark
# *inputs*: "fixing" them would silently change what the benchmark measures.
#
# Pinning keeps the gate's meaning a property of this repo instead of a property
# of whichever Ruff version happens to resolve. Widening the set is a deliberate
# act -- add families here, triage the findings, and leave `tools/` alone.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# There is deliberately no [tool.ruff.lint.mccabe] block here. A `max-complexity`
# key in this file would be inert and actively misleading: `ruff check .` only
# runs C901 when the rule is selected, and the `select` above excludes it. A
# budget written here would silently do nothing -- tightening it to 1 leaves
# `ruff check .` reporting clean.
#
# The complexity budget that actually governs is
# `toolbench.complexity_gate.DEFAULT_THRESHOLD`, enforced base-relative in CI
# (see .github/workflows/ci.yml). That gate cannot read this file by design:
# `collect_complexities()` invokes Ruff with `--isolated` so the base snapshot --
# written to a temp directory that has no pyproject.toml -- is measured under
# exactly the same config as the working tree. Change the budget there, not here.

# Pin the type-check scope so a bare local `mypy` mirrors the CI gate
# (`mypy --strict src/toolbench tests`). Without this, a bare `mypy .` descends
# into the `tools/` probe corpus -- vendored benchmark fixtures that are excluded
# from the gate by design -- and reports ~88 strict errors that CI never sees.
# CI still passes explicit paths + `--strict` on the command line, which take
# precedence over `files` and duplicate `strict`, so this changes local runs only.
[tool.mypy]
files = ["src/toolbench", "tests"]
strict = true
