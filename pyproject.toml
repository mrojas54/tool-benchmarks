[project]
name = "toolbench"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
toolbench = "toolbench.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
